<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Landing Page Generator</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="app-container">
        <aside class="control-panel">
            <h2>Ρυθμίσεις Σελίδας</h2>
            <form id="generator-form">
                <div class="form-group">
                    <label for="biz-name">Όνομα Επιχείρησης:</label>
                    <input type="text" id="biz-name" placeholder="π.χ. Burger House">
                </div>

                <div class="form-group">
                    <label for="biz-type">Τύπος Επιχείρησης:</label>
                    <select id="biz-type">
                        <option value="restaurant">Εστιατόριο</option>
                        <option value="service">Υπηρεσίες</option>
                        <option value="hotel">Ξενοδοχείο</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="biz-desc">Περιγραφή:</label>
                    <textarea id="biz-desc" placeholder="Γράψε δύο λόγια για την επιχείρηση..."></textarea>
                </div>

                <div class="form-group">
                    <label for="hero-upload">Αλλαγή Hero Image:</label>
                    <input type="file" id="hero-upload" accept="image/*">
                </div>

                <button type="button" id="download-btn" class="download-action-btn">
                    Download Template (.html)
                </button>
            </form>
        </aside>

        <main class="preview-panel" id="preview-section" data-theme="restaurant">
        </main>
    </div>

    <script src="app.js"></script>
</body>

</html>
